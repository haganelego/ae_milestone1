[project]
name = "pgsg-env"
version = "0.1.0"
description = "Isolated runtime for PGSG (Pix2Grp CVPR 2024, LAVIS) inference on RTX 5080 (sm_120)"
requires-python = "==3.11.*"
dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "transformers==4.29.2",
    "tokenizers==0.13.3",
    "huggingface-hub==0.16.4",
    "timm==0.4.12",
    "peft==0.5.0",
    "accelerate==0.22.0",
    "fairscale==0.4.13",
    "numpy==1.26.4",
    "omegaconf==2.3.0",
    "h5py==3.11.0",
    "iopath==0.1.10",
    "webdataset==0.2.48",
    "decord==0.6.0",
    "opencv-python-headless==4.8.1.78",
    "pycocotools==2.0.8",
    "pycocoevalcap==1.2",
    "scipy==1.13.1",
    "pandas==2.2.2",
    "einops==0.6.1",
    "ftfy==6.1.1",
    "contexttimer==0.3.3",
    "GitPython==3.1.43",
    "tabulate==0.9.0",
    "termcolor==2.3.0",
    "sentencepiece==0.2.0",
    "regex==2023.8.8",
    "portalocker==2.7.0",
    "scikit-learn==1.5.1",
    "scikit-image==0.24.0",
    "matplotlib==3.9.2",
    "msgspec==0.18.6",
    "easydict==1.10",
    "pillow==10.4.0",
    "tqdm==4.66.4",
    "pyyaml==6.0.1",
    "safetensors==0.4.3",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
